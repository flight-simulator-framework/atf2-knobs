[project]
name = "flight-atf2-knobs"
version = "0.2.0"
description = "ATF2 IPBSM optimization, beam tuning, linac optimization and synthetic controllers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "scipy>=1.17,<2",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces>=0.2.0,<0.3",
]

[project.gui-scripts]
DRTuning = "Knobs.DRTuning.__main__:main"
RandomExcitation = "Knobs.RandomExcitation.__main__:main"

[project.optional-dependencies]
atf2 = [
    "machine-interfaces-atf2>=0.2.0,<0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Knobs"]

[tool.flight-simulator.migration]
status = "package-registry"
