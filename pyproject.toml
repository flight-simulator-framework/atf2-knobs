[project]
name = "flight-atf2-knobs"
version = "0.2.0"
description = "ATF2 IPBSM optimization, beam tuning, linac optimization and synthetic controllers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces>=0.2.0,<0.3",
]

[project.optional-dependencies]
atf2 = [
    "machine-interfaces-atf2>=0.2.0,<0.3",
]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "Knobs"}]

[tool.poetry.dependencies]
machine-interfaces = {source = "flight-simulator"}
machine-interfaces-atf2 = {source = "flight-simulator"}

[[tool.poetry.source]]
name = "flight-simulator"
url = "https://gitlab.cern.ch/api/v4/groups/363527/-/packages/pypi/simple/"
priority = "explicit"
[tool.flight-simulator.migration]
status = "package-registry"
